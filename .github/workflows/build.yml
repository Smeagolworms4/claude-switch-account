name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest and translations
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json"));
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            if (!m.default_locale) throw new Error("default_locale is missing");

            const locales = fs.readdirSync("_locales");
            const ref = JSON.parse(fs.readFileSync(`_locales/${m.default_locale}/messages.json`));
            const keys = Object.keys(ref);

            for (const loc of locales) {
              const msgs = JSON.parse(fs.readFileSync(`_locales/${loc}/messages.json`));
              const missing = keys.filter((k) => !(k in msgs));
              const extra = Object.keys(msgs).filter((k) => !keys.includes(k));
              if (missing.length) throw new Error(`${loc}: missing keys -> ${missing.join(", ")}`);
              if (extra.length) throw new Error(`${loc}: unknown keys -> ${extra.join(", ")}`);
            }
            console.log(`OK - ${keys.length} keys x ${locales.length} locales (${locales.join(", ")})`);
          '

      - name: Check JS syntax
        run: for f in background.js popup.js; do node --check "$f"; done

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json"));
            m.version = process.argv[1];
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zip
        run: bash tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-switch-account
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # Publishes to the Chrome Web Store on v* tags. Skipped when the CWS secrets
  # are not configured, so forks and early tags still build fine.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for Chrome Web Store credentials
        id: creds
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
        run: |
          if [ -n "$CWS_CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CWS secrets missing, skipping Chrome Web Store publish"
          fi

      - name: Download the built package
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: claude-switch-account
          path: dist

      - name: Upload and publish
        if: steps.creds.outputs.ready == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node tools/publish-cws.mjs dist/*.zip
